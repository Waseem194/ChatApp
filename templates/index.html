<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Chat App</title>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header d-flex align-items-center p-3 text-white">
            <div class="rounded-circle bg-secondary me-3" style="width: 40px; height: 40px;"></div>
            <div>
                <h6 class="mb-0" id="display-name">Loading...</h6>
                <small id="status-text">online</small>
            </div>
        </div>

        <div id="messages" class="message-area p-3"></div>

        <div class="input-bar p-2">
            <form id="chat-form" onsubmit="sendMessage(event)" class="d-flex">
                <input type="text" class="form-control rounded-pill border-0 py-2 px-3" id="messageText" placeholder="Type a message" autocomplete="off">
                <button class="btn btn-success rounded-circle ms-2" type="submit">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
